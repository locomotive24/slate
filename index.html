<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101013">
<title>Slate</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 4 7 20M17 4l-2 16M4.5 9h15M4 15h15"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 3.5 10.5l6.5 3 3 6.5L21 3Z"/><path d="M21 3 10 13.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4.5 4.5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19.5c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><path d="M15.4 4.8a3.4 3.4 0 0 1 0 6.4M17.4 13.5c2.4.7 4.1 2.8 4.1 6"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8.6M17.4 6H20M4 12h2.6M11.4 12H20M4 18h8.6M17.4 18H20"/><circle cx="15" cy="6" r="2.1"/><circle cx="9" cy="12" r="2.1"/><circle cx="15" cy="18" r="2.1"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6.5 6.5 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5L19.5 7"/></symbol>
  <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19.5c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2M18 8v6M15 11h6"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 3.5V16h-1A2.5 2.5 0 0 1 4 13.5Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6.5 7l.8 12.4a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7M10 11v6M14 11v6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1.5 1.5 0 0 1 1.5-1.5H15"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M16 8l4 4-4 4M20 12H10M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m5 17.5 4.5-4.5 3.5 3.5 2.5-2.5 4 4"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M9 15 4 10l5-5"/><path d="M4 10h9a7 7 0 0 1 7 7v2"/></symbol>
</svg>

<!-- ============ AUTH ============ -->
<section id="authView" class="auth">
  <div class="auth-brand">
    <div>
      <div class="wordmark">slate<span class="wordmark-dot"></span></div>
      <p class="tagline mono">ROOMS · FRIENDS · REALTIME</p>
    </div>
    <div>
      <p class="brand-copy">A quiet grey place to talk. Make rooms, add friends, pick a color — the conversation is yours.</p>
      <div class="brand-meter">
        <canvas id="pingCanvas" width="440" height="56"></canvas>
        <div class="meter-row mono">
          <span class="status-dot" id="apiDot"></span>
          <span id="apiStatus">connecting…</span>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab is-active" data-tab="login">Sign in</button>
      <button type="button" class="auth-tab" data-tab="signup">Create account</button>
    </div>

    <form id="loginForm" class="auth-form" novalidate>
      <label class="field"><span class="field-label mono">EMAIL OR USERNAME</span>
        <input name="identifier" autocomplete="username" spellcheck="false" required>
      </label>
      <label class="field"><span class="field-label mono">PASSWORD</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="form-error mono" id="loginError" hidden></p>
      <button class="btn btn-accent btn-block" type="submit" id="loginBtn">Sign in</button>
    </form>

    <form id="signupForm" class="auth-form" novalidate hidden>
      <label class="field"><span class="field-label mono">EMAIL</span>
        <input name="email" type="email" autocomplete="email" spellcheck="false" required>
      </label>
      <label class="field"><span class="field-label mono">USERNAME</span>
        <input name="username" autocomplete="username" spellcheck="false" required>
        <span class="field-hint mono">3–20 chars · letters, numbers, underscore</span>
      </label>
      <label class="field"><span class="field-label mono">DISPLAY NAME — OPTIONAL</span>
        <input name="displayName" maxlength="32">
      </label>
      <label class="field"><span class="field-label mono">PASSWORD</span>
        <input name="password" type="password" autocomplete="new-password" required>
        <span class="field-hint mono">at least 8 characters</span>
      </label>
      <p class="form-error mono" id="signupError" hidden></p>
      <button class="btn btn-accent btn-block" type="submit" id="signupBtn">Create account</button>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<main id="appView" class="app" hidden>
  <nav class="rail">
    <button class="rail-btn rail-home" id="railHome" title="Home"></button>
    <div class="rail-sep"></div>
    <div class="rail-scroll" id="railServers"></div>
    <button class="rail-add" id="railAdd" title="Create or join a server"></button>
    <div class="rail-gap"></div>
    <button class="rail-btn" id="railFriends" title="Friends"></button>
    <button class="rail-btn" id="railTheme" title="Toggle theme"></button>
    <button class="rail-avatar" id="railAvatar" title="You — open settings"></button>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-body" id="sidebarBody"></div>
  </aside>
  <div class="scrim" id="scrimSidebar"></div>

  <section class="chat" id="chatSection">
    <header class="chat-head">
      <button class="icon-btn mobile-only" id="menuBtn" title="Menu"></button>
      <h2 class="chat-title" id="chatTitle"></h2>
      <nav class="home-tabs" id="homeTabs"></nav>
      <span class="chat-meta mono" id="chatMeta"></span>
      <span class="head-gap"></span>
      <button class="icon-btn" id="membersToggle" title="Toggle members"></button>
    </header>

    <section class="home-view" id="homeView">
      <div class="home-body" id="homeBody"></div>
    </section>

    <div class="chat-main">
      <div class="chat-scroll" id="chatScroll">
        <div class="messages" id="messages"></div>
      </div>
      <div class="chat-empty" id="chatEmpty">
        <div class="empty-mark">slate<span class="wordmark-dot"></span></div>
        <p class="mono empty-hint" id="emptyHint"></p>
        <div class="empty-cta">
          <button class="btn btn-ghost btn-sm" id="emptyCtaFriends">Find friends</button>
          <button class="btn btn-ghost btn-sm" id="emptyCtaServer">Create a server</button>
        </div>
      </div>
    </div>

    <div class="typing-bar mono" id="typingBar" hidden></div>

    <footer class="composer">
      <div class="composer-box" id="composerBox">
        <div class="reply-bar" id="replyBar" hidden>
          <span id="replyIconSlot"></span>
          <div class="reply-info" id="replyInfo"></div>
          <button class="icon-btn" id="replyCancel" title="Cancel reply"></button>
        </div>
        <div class="pending-image" id="pendingImageRow" hidden>
          <img id="pendingImageThumb" alt="Attached image">
          <span class="pending-label mono">IMAGE READY — SENDS WITH YOUR NEXT MESSAGE</span>
          <button class="icon-btn" id="pendingImageRemove" title="Remove image"></button>
        </div>
        <div class="composer-row">
          <button class="icon-btn composer-extra" id="attachBtn" title="Attach an image"></button>
          <button class="gif-btn mono" id="gifBtn" type="button" hidden>GIF</button>
          <textarea id="composerInput" rows="1" placeholder="Message…" maxlength="2000"></textarea>
          <button class="btn btn-accent btn-send" id="sendBtn" title="Send"></button>
        </div>
        <input type="file" id="imageFile" accept="image/*" hidden>
        <div class="mention-pop" id="mentionPop" hidden></div>
      </div>
    </footer>

    <button class="jump-btn" id="jumpBtn" title="Jump to latest"></button>
  </section>

  <aside class="members" id="membersPanel">
    <header class="members-head mono" id="membersHead">MEMBERS</header>
    <div class="members-body" id="membersBody"></div>
  </aside>
  <div class="scrim" id="scrimMembers"></div>
</main>

<!-- ============ SETTINGS ============ -->
<aside class="settings" id="settingsPanel">
  <header class="settings-head">
    <h3>Settings</h3>
    <button class="icon-btn" id="settingsClose" title="Close"></button>
  </header>
  <div class="settings-scroll">
    <section class="settings-sec">
      <h4 class="sec-title mono">PROFILE</h4>
      <div class="avatar-row">
        <span id="settingsAvatar"></span>
        <div class="avatar-actions">
          <label class="btn btn-ghost btn-sm">
            <span>Upload picture</span>
            <input type="file" id="avatarFile" accept="image/*" hidden>
          </label>
          <button class="btn btn-ghost btn-sm" id="avatarRemove">Remove</button>
        </div>
      </div>
      <label class="field"><span class="field-label mono">USERNAME</span>
        <input id="usernameInput" maxlength="20" spellcheck="false">
        <span class="field-hint mono">3–20 chars · letters, numbers, underscore</span>
      </label>
      <label class="field"><span class="field-label mono">DISPLAY NAME</span>
        <input id="displayNameInput" maxlength="32">
      </label>
      <label class="field"><span class="field-label mono">BIO</span>
        <textarea id="bioInput" rows="3" maxlength="280" placeholder="Say a little about yourself"></textarea>
        <span class="field-hint mono"><span id="bioCount">0</span>/280</span>
      </label>
      <button class="btn btn-accent" id="profileSave">Save profile</button>
    </section>

    <section class="settings-sec">
      <h4 class="sec-title mono">APPEARANCE</h4>
      <div class="seg" id="themeSeg">
        <button class="seg-btn is-active" data-theme-set="dark" type="button">Dark</button>
        <button class="seg-btn" data-theme-set="light" type="button">Light</button>
      </div>
      <p class="field-label mono" style="margin-top:18px">ACCENT</p>
      <div class="swatches" id="swatches"></div>
    </section>

    <section class="settings-sec">
      <h4 class="sec-title mono">ACCOUNT</h4>
      <dl class="account-facts mono" id="accountFacts"></dl>
      <button class="btn btn-danger" id="logoutBtn">Log out</button>
      <p class="field-hint mono" style="margin-top:14px">CONNECTED TO<br><span id="settingsApi"></span></p>
    </section>
  </div>
</aside>
<div class="scrim" id="scrimSettings"></div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div class="conn-banner mono" id="connBanner" hidden>RECONNECTING…</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.5/client-dist/socket.io.min.js" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
